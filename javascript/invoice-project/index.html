
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Invoice Card -->

      <div class="invoice-card">
        <h1 class="invoice-title">🧾 Invoice</h1>

        <div class="row">
          <span>Product Price</span>

          <span class="price" id="productPrice"> $1,000.00 </span>
        </div>

        <div class="row">
          <span>Tax (14%)</span>

          <span class="price" id="taxValue"> $140.00 </span>
        </div>

        <div class="divider"></div>

        <div class="row total">
          <span>Total</span>

          <span id="totalValue"> $1,140.00 </span>
        </div>
      </div>

      <!-- Input -->

      <div class="input-section">
        <label for="amount"> Invoice Amount </label>

        <input type="number" id="amount" value="1000" />
      </div>
    </div>

    <!-- Confirmation Modal -->

    <div class="modal" id="modal">
      <div class="modal-content">
        <h2>Are you sure?</h2>

        <p id="confirmationMessage">Change amount?</p>

        <div class="buttons">
          <button class="cancel" id="cancelBtn">Cancel</button>

          <button class="confirm" id="confirmBtn">Yes</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
